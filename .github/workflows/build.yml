name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/davidcohendc/machine-learning-labs

jobs:
  lint:
    name: Notebooks and modules parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: nbformat validation and py_compile
        run: |
          pip install -q nbformat
          python - <<'PY'
          import glob, nbformat
          for f in sorted(glob.glob('*/*.ipynb')):
              nbformat.validate(nbformat.read(f, as_version=4)); print('ok', f)
          PY
          python -m py_compile */*.py

  smoke:
    name: Build image & run the fast notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The image is 2 GB of pinned wheels; the layer is cached between runs.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lab 1 and lab 3 run top to bottom
        run: |
          docker compose run --rm lab scripts/run.sh 01-svm-knn/svm-knn.ipynb
          docker compose run --rm lab scripts/run.sh 03-solar-regression/regression.ipynb

  release:
    name: Release
    needs: [lint, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run semantic-release
        run: npx --yes -p semantic-release@24 -p @semantic-release/exec@7 semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Version released by this push, if any
        id: version
        run: |
          tag=$(git describe --tags --exact-match 2>/dev/null \
            || git ls-remote --tags origin | awk -v sha="$GITHUB_SHA" '$1 == sha { print $2 }' | sed 's#refs/tags/##; s#\^{}##' | head -1)
          echo "tag=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        if: steps.version.outputs.tag != ''

      - uses: docker/login-action@v4
        if: steps.version.outputs.tag != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image to GitHub Packages
        if: steps.version.outputs.tag != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
